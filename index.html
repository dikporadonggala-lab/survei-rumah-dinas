<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dashboard Survei Rumah Dinas Guru</title>
  <meta name="theme-color" content="#1E62B5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#1E62B5',
              secondary: '#4A89DC',
              accent: '#D92B2B',
              canvas: '#F4F7FA',
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- SheetJS (XLSX) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- jsPDF & AutoTable CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <style>
    /* Overlay penuh menutupi elemen bawaan Blogger */
    #rumdin-app-root {
      position: fixed;
      inset: 0;
      z-index: 999999;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #F4F7FA;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1E293B;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar halus */
    #rumdin-app-root::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    #rumdin-app-root::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    #rumdin-app-root::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    #rumdin-app-root::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .card-elevation {
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
    }

    /* Animasi transisi halus */
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.98) translateY(4px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .animate-fade-in {
      animation: fadeInScale 0.22s ease-out forwards;
    }
  </style>
</head>
<body>
  <!-- Kontainer Utama Aplikasi -->
  <div id="rumdin-app-root"></div>

  <!-- Application Script (ES Module + Supabase JS v2) -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // =========================================================================
    // 1. KONFIGURASI SAKLAR DEPLOYMENT (WAJIB DIATUR SEBELUM DEPLOY)
    // =========================================================================
    const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY agar mode preview & data dummy hilang dan terhubung 100% ke Supabase
    const SUPABASE_URL = "https://gtbmdihkkrblmyagxwzs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0Ym1kaWhra3JibG15YWd4d3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1Nzk3OTYsImV4cCI6MjExMTE1NTc5Nn0.BiXhnCxQcYm5FjzNtrpX9dAJt5-4KBE86O-WEYfKAWQ";

    // Inisialisasi Supabase Client (hanya aktif jika IS_PREVIEW === false)
    let supabase = null;
    if (!IS_PREVIEW) {
      if (!SUPABASE_URL.startsWith('http') || SUPABASE_ANON_KEY === 'ANON_KEY_ANDA') {
        console.error('Konfigurasi SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi dengan benar.');
      } else {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    }

    // =========================================================================
    // 2. INISIALISASI PWA 1-FILE (MANIFEST DATA URI + BLOB SERVICE WORKER)
    // =========================================================================
    (function initPWA() {
      try {
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#1E62B5"/><path d="M256 112L96 240h48v160h96v-96h32v96h96V240h48L256 112z" fill="#FFFFFF"/><circle cx="384" cy="144" r="44" fill="#D92B2B"/></svg>`;
        const iconUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

        const manifestObj = {
          name: 'Survei Rumah Dinas Guru',
          short_name: 'Survei Rumdin',
          description: 'Sistem Pendataan & Survei Kondisi Rumah Dinas Guru',
          start_url: location.href,
          display: 'standalone',
          background_color: '#F4F7FA',
          theme_color: '#1E62B5',
          icons: [
            { src: iconUri, sizes: '192x192', type: 'image/svg+xml' },
            { src: iconUri, sizes: '512x512', type: 'image/svg+xml' }
          ]
        };

        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
        document.head.appendChild(manifestLink);

        if ('serviceWorker' in navigator && location.protocol === 'https:') {
          const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => {
              e.respondWith(fetch(e.request).catch(() => new Response('Offline', { status: 503 })));
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      } catch (err) {
        // Abaikan jika environment iframe membatasi SW
      }
    })();

    // =========================================================================
    // 3. DAFTAR STANDAR 16 KECAMATAN & DATA PREVIEW MINIMALIS
    // =========================================================================
    const DEFAULT_16_KECAMATAN = [
      'Kecamatan 01', 'Kecamatan 02', 'Kecamatan 03', 'Kecamatan 04',
      'Kecamatan 05', 'Kecamatan 06', 'Kecamatan 07', 'Kecamatan 08',
      'Kecamatan 09', 'Kecamatan 10', 'Kecamatan 11', 'Kecamatan 12',
      'Kecamatan 13', 'Kecamatan 14', 'Kecamatan 15', 'Kecamatan 16'
    ];

    // Data dummy minimalis (maksimal 2 baris) hanya aktif saat IS_PREVIEW = true
    let previewDataStore = IS_PREVIEW ? [
      {
        id: 'prev-1',
        npsn: '40100101',
        nama_sekolah: 'SD Negeri 01 Contoh Kota',
        alamat: 'Jl. Pendidikan No. 12',
        kecamatan: 'Kecamatan 01',
        is_submitted: true,
        status_rumdin: 'Ada',
        kondisi: 'Rusak Ringan',
        foto_url: 'https://placehold.co/800x500/1E62B5/FFFFFF?text=Foto+Rumah+Dinas+SDN+01',
        submitted_at: new Date().toISOString()
      },
      {
        id: 'prev-2',
        npsn: '40100102',
        nama_sekolah: 'SMP Negeri 02 Harapan Bangsa',
        alamat: 'Jl. Merdeka Utara No. 45',
        kecamatan: 'Kecamatan 02',
        is_submitted: false,
        status_rumdin: null,
        kondisi: null,
        foto_url: null,
        submitted_at: null
      }
    ] : [];

    // =========================================================================
    // 4. STATE APLIKASI TERPUSAT
    // =========================================================================
    const state = {
      session: null, // { role: 'admin' | 'school', user: {...} }
      loginTab: 'school', // 'school' | 'admin'
      activeAdminMenu: 'dashboard', // 'dashboard' | 'survei' | 'sekolah'
      sidebarCollapsed: false,
      loading: false,
      submitting: false,
      allData: [],
      // Filter & Search pada Menu Data Hasil Survei
      searchQuery: '',
      filterStatus: 'all', // 'all' | 'submitted' | 'unsubmitted' | 'ada' | 'belum'
      // Search pada Menu Database Referensi Sekolah
      refSearchQuery: '',
      // Form Sekolah
      schoolForm: {
        status_rumdin: '', // 'Ada' | 'Belum Ada'
        kondisi: '', // 'Baik' | 'Rusak Ringan' | 'Rusak Berat'
        file: null,
        previewDataUrl: ''
      },
      // Modal States
      photoModalUrl: null,
      photoModalTitle: '',
      schoolModal: {
        open: false,
        mode: 'add', // 'add' | 'edit'
        data: { id: null, npsn: '', nama_sekolah: '', alamat: '', kecamatan: '' }
      },
      confirmModal: {
        open: false,
        title: '',
        message: '',
        confirmText: 'Ya, Lanjutkan',
        confirmColor: 'bg-[#D92B2B]',
        onConfirm: null
      },
      toast: null // { type: 'success' | 'error' | 'info', message: '' }
    };

    let barChartInstance = null;
    let doughnutChartInstance = null;
    let clockInterval = null;

    // =========================================================================
    // 5. UTILITAS NOTIFIKASI (TOAST) & MODAL KONFIRMASI (TANPA ALERT/CONFIRM)
    // =========================================================================
    function showToast(message, type = 'info') {
      state.toast = { message, type };
      renderToast();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.toast = null;
        renderToast();
      }, 4000);
    }

    function openConfirm({ title, message, confirmText = 'Ya, Lanjutkan', confirmColor = 'bg-[#D92B2B]', onConfirm }) {
      state.confirmModal = { open: true, title, message, confirmText, confirmColor, onConfirm };
      render();
    }

    function closeConfirm() {
      state.confirmModal.open = false;
      render();
    }

    // =========================================================================
    // 6. OPERASI DATA & AUTENTIKASI (PREVIEW VS SUPABASE LIVE)
    // =========================================================================
    async function initSession() {
      if (IS_PREVIEW) {
        const saved = sessionStorage.getItem('rumdin_preview_session');
        if (saved) {
          state.session = JSON.parse(saved);
          await loadData();
        }
        render();
        return;
      }

      // Cek sesi Admin Supabase
      if (supabase) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session && session.user) {
          state.session = { role: 'admin', user: { email: session.user.email } };
          await loadData();
          render();
          return;
        }
      }

      // Cek sesi Sekolah (disimpan di sessionStorage setelah validasi SELECT ke Supabase)
      const savedSchool = sessionStorage.getItem('rumdin_school_npsn');
      if (savedSchool && supabase) {
        const { data, error } = await supabase
          .from('data_survei_sekolah')
          .select('*')
          .eq('npsn', savedSchool)
          .maybeSingle();

        if (!error && data) {
          state.session = { role: 'school', user: data };
          syncSchoolFormFromUser(data);
        } else {
          sessionStorage.removeItem('rumdin_school_npsn');
        }
      }
      render();
    }

    function syncSchoolFormFromUser(schoolData) {
      if (!schoolData.is_submitted) {
        state.schoolForm = {
          status_rumdin: '',
          kondisi: '',
          file: null,
          previewDataUrl: ''
        };
      }
    }

    async function loadData() {
      if (!state.session) return;
      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          state.allData = [...previewDataStore];
          if (state.session.role === 'school') {
            const fresh = state.allData.find(s => s.npsn === state.session.user.npsn);
            if (fresh) {
              state.session.user = fresh;
              sessionStorage.setItem('rumdin_preview_session', JSON.stringify(state.session));
            }
          }
        } else {
          if (!supabase) throw new Error('Koneksi Supabase belum dikonfigurasi.');
          if (state.session.role === 'admin') {
            const { data, error } = await supabase
              .from('data_survei_sekolah')
              .select('*')
              .order('kecamatan', { ascending: true })
              .order('nama_sekolah', { ascending: true });
            if (error) throw error;
            state.allData = data || [];
          } else if (state.session.role === 'school') {
            const { data, error } = await supabase
              .from('data_survei_sekolah')
              .select('*')
              .eq('npsn', state.session.user.npsn)
              .single();
            if (error) throw error;
            state.session.user = data;
          }
        }
      } catch (err) {
        showToast('Gagal memuat data: ' + (err.message || 'Terjadi kesalahan'), 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleSchoolLogin(npsnInput) {
      const npsn = (npsnInput || '').trim();
      if (!npsn) {
        showToast('Silakan masukkan NPSN sekolah Anda.', 'error');
        return;
      }

      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          const found = previewDataStore.find(item => item.npsn === npsn);
          if (!found) {
            throw new Error('NPSN tidak ditemukan di database referensi preview. Gunakan 40100101 atau 40100102.');
          }
          state.session = { role: 'school', user: { ...found } };
          sessionStorage.setItem('rumdin_preview_session', JSON.stringify(state.session));
          syncSchoolFormFromUser(found);
          showToast(`Selamat datang, ${found.nama_sekolah}!`, 'success');
        } else {
          if (!supabase) throw new Error('Supabase belum dikonfigurasi.');
          const { data, error } = await supabase
            .from('data_survei_sekolah')
            .select('*')
            .eq('npsn', npsn)
            .maybeSingle();

          if (error) throw error;
          if (!data) {
            throw new Error('NPSN tidak terdaftar dalam database referensi sekolah. Hubungi Admin.');
          }

          state.session = { role: 'school', user: data };
          sessionStorage.setItem('rumdin_school_npsn', data.npsn);
          syncSchoolFormFromUser(data);
          showToast(`Berhasil masuk sebagai ${data.nama_sekolah}`, 'success');
        }
      } catch (err) {
        showToast(err.message || 'Gagal login sekolah.', 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleAdminLogin(emailInput, passwordInput) {
      const email = (emailInput || '').trim();
      const password = (passwordInput || '').trim();

      if (!email || !password) {
        showToast('Email dan password Admin wajib diisi.', 'error');
        return;
      }

      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          state.session = { role: 'admin', user: { email: email || 'admin@preview.local' } };
          sessionStorage.setItem('rumdin_preview_session', JSON.stringify(state.session));
          await loadData();
          showToast('Berhasil masuk sebagai Admin (Mode Preview).', 'success');
        } else {
          if (!supabase) throw new Error('Supabase belum dikonfigurasi.');
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          state.session = { role: 'admin', user: { email: data.user.email } };
          await loadData();
          showToast('Login Admin berhasil!', 'success');
        }
      } catch (err) {
        showToast('Login Admin gagal: ' + (err.message || 'Kredensial tidak valid'), 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleLogout() {
      try {
        if (!IS_PREVIEW && supabase && state.session?.role === 'admin') {
          await supabase.auth.signOut();
        }
      } catch (e) {}

      sessionStorage.removeItem('rumdin_preview_session');
      sessionStorage.removeItem('rumdin_school_npsn');
      state.session = null;
      state.allData = [];
      state.schoolForm = { status_rumdin: '', kondisi: '', file: null, previewDataUrl: '' };
      showToast('Anda telah keluar dari aplikasi.', 'info');
      render();
    }

    // =========================================================================
    // 7. OPERASI FORM SURVEI SEKOLAH (VALIDASI MAX 1MB & UPLOAD SUPABASE)
    // =========================================================================
    function handlePhotoFileChange(file) {
      if (!file) return;

      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
      if (!allowedTypes.includes(file.type)) {
        showToast('Format foto harus berupa JPG, PNG, atau WEBP.', 'error');
        return;
      }

      // Validasi ketat maksimal 1 MB (1048576 bytes)
      const MAX_BYTES = 1048576;
      if (file.size > MAX_BYTES) {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        showToast(`Ukuran file (${sizeMB} MB) melebihi batas maksimal 1 MB! Silakan kompres foto terlebih dahulu.`, 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        state.schoolForm.file = file;
        state.schoolForm.previewDataUrl = e.target.result;
        render();
      };
      reader.readAsDataURL(file);
    }

    async function submitSchoolSurvey() {
      const school = state.session?.user;
      if (!school || school.is_submitted) return;

      const { status_rumdin, kondisi, file, previewDataUrl } = state.schoolForm;

      if (!status_rumdin) {
        showToast('Silakan pilih jawaban ketersediaan Rumah Dinas (Ada atau Belum Ada).', 'error');
        return;
      }

      if (status_rumdin === 'Ada') {
        if (!file) {
          showToast('Anda wajib mengunggah foto kondisi Rumah Dinas (Maks. 1 MB).', 'error');
          return;
        }
        if (file.size > 1048576) {
          showToast('Ukuran foto melebihi batas maksimal 1 MB!', 'error');
          return;
        }
        if (!kondisi) {
          showToast('Silakan pilih kondisi Rumah Dinas (Baik, Rusak Ringan, atau Rusak Berat).', 'error');
          return;
        }
      }

      state.submitting = true;
      render();

      try {
        let uploadedUrl = null;

        if (status_rumdin === 'Ada') {
          if (IS_PREVIEW) {
            uploadedUrl = previewDataUrl;
          } else {
            const ext = file.name.split('.').pop() || 'jpg';
            const filePath = `${school.npsn}_${Date.now()}.${ext}`;

            const { error: uploadError } = await supabase.storage
              .from('foto-rumdin')
              .upload(filePath, file, {
                cacheControl: '3600',
                upsert: true,
                contentType: file.type
              });

            if (uploadError) {
              throw new Error('Gagal mengunggah foto ke Storage: ' + uploadError.message);
            }

            const { data: publicUrlData } = supabase.storage
              .from('foto-rumdin')
              .getPublicUrl(filePath);

            uploadedUrl = publicUrlData.publicUrl;
          }
        }

        const payload = {
          is_submitted: true,
          status_rumdin: status_rumdin,
          kondisi: status_rumdin === 'Ada' ? kondisi : null,
          foto_url: status_rumdin === 'Ada' ? uploadedUrl : null,
          submitted_at: new Date().toISOString()
        };

        if (IS_PREVIEW) {
          const idx = previewDataStore.findIndex(item => item.npsn === school.npsn);
          if (idx !== -1) {
            previewDataStore[idx] = { ...previewDataStore[idx], ...payload };
            state.session.user = { ...previewDataStore[idx] };
            sessionStorage.setItem('rumdin_preview_session', JSON.stringify(state.session));
          }
        } else {
          const { data, error } = await supabase
            .from('data_survei_sekolah')
            .update(payload)
            .eq('id', school.id)
            .select()
            .single();

          if (error) throw error;
          state.session.user = data;
        }

        showToast('Data survei berhasil dikirim dan dikunci secara otomatis!', 'success');
      } catch (err) {
        showToast(err.message || 'Gagal mengirim survei.', 'error');
      } finally {
        state.submitting = false;
        render();
      }
    }

    // =========================================================================
    // 8. OPERASI ADMIN (RESET SURVEI, CRUD SEKOLAH, IMPORT EXCEL/CSV, EXPORT)
    // =========================================================================
    function confirmResetSurvey(school) {
      openConfirm({
        title: 'Reset Jawaban Survei Sekolah?',
        message: `Kunci survei untuk "${school.nama_sekolah}" (NPSN: ${school.npsn}) akan dibuka kembali dan jawaban sebelumnya akan dikosongkan agar sekolah dapat mengirim ulang.`,
        confirmText: 'Ya, Reset Survei',
        confirmColor: 'bg-amber-600 hover:bg-amber-700',
        onConfirm: async () => {
          closeConfirm();
          state.loading = true;
          render();
          try {
            const resetPayload = {
              is_submitted: false,
              status_rumdin: null,
              kondisi: null,
              foto_url: null,
              submitted_at: null
            };

            if (IS_PREVIEW) {
              const idx = previewDataStore.findIndex(s => s.id === school.id);
              if (idx !== -1) {
                previewDataStore[idx] = { ...previewDataStore[idx], ...resetPayload };
              }
            } else {
              const { error } = await supabase
                .from('data_survei_sekolah')
                .update(resetPayload)
                .eq('id', school.id);
              if (error) throw error;
            }

            await loadData();
            showToast(`Survei ${school.nama_sekolah} berhasil di-reset.`, 'success');
          } catch (err) {
            showToast('Gagal mereset survei: ' + err.message, 'error');
            state.loading = false;
            render();
          }
        }
      });
    }

    async function saveSchoolManual(formData) {
      const npsn = (formData.npsn || '').trim();
      const nama_sekolah = (formData.nama_sekolah || '').trim();
      const alamat = (formData.alamat || '').trim();
      const kecamatan = (formData.kecamatan || '').trim();

      if (!npsn || !nama_sekolah || !kecamatan) {
        showToast('NPSN, Nama Sekolah, dan Kecamatan wajib diisi.', 'error');
        return;
      }

      state.loading = true;
      render();

      try {
        if (state.schoolModal.mode === 'add') {
          if (IS_PREVIEW) {
            if (previewDataStore.some(s => s.npsn === npsn)) {
              throw new Error('NPSN sudah terdaftar.');
            }
            previewDataStore.push({
              id: 'prev-' + Date.now(),
              npsn,
              nama_sekolah,
              alamat,
              kecamatan,
              is_submitted: false,
              status_rumdin: null,
              kondisi: null,
              foto_url: null,
              submitted_at: null
            });
          } else {
            const { error } = await supabase
              .from('data_survei_sekolah')
              .insert([{ npsn, nama_sekolah, alamat, kecamatan, is_submitted: false }]);
            if (error) throw error;
          }
          showToast('Data sekolah berhasil ditambahkan.', 'success');
        } else {

    async function handleBulkImportFile(file) {
      if (!file) return;
      state.loading = true;
      render();

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

        if (!rows.length) {
          throw new Error('File Excel/CSV kosong.');
        }

        // Pemetaan kolom fleksibel (case-insensitive)
        const parsedRecords = [];
        const seenNpsn = new Set();

        for (const row of rows) {
          const normalized = {};
          Object.keys(row).forEach(k => {
            normalized[k.trim().toLowerCase()] = String(row[k]).trim();
          });

          const npsn = normalized['npsn'] || normalized['kode_sekolah'] || normalized['kode'] || '';
          const nama_sekolah = normalized['nama sekolah'] || normalized['nama_sekolah'] || normalized['sekolah'] || '';
          const alamat = normalized['alamat'] || normalized['alamat sekolah'] || normalized['alamat_sekolah'] || '-';
          const kecamatan = normalized['kecamatan'] || normalized['wilayah'] || '';

          if (npsn && nama_sekolah && kecamatan && !seenNpsn.has(npsn)) {
            seenNpsn.add(npsn);
            parsedRecords.push({
              npsn,
              nama_sekolah,
              alamat,
              kecamatan
            });
          }
        }

        if (!parsedRecords.length) {
          throw new Error('Format kolom tidak valid. Pastikan terdapat kolom: NPSN, Nama Sekolah, Alamat, dan Kecamatan.');
        }

        if (IS_PREVIEW) {
          parsedRecords.forEach((rec, i) => {
            const existIdx = previewDataStore.findIndex(s => s.npsn === rec.npsn);
            if (existIdx !== -1) {
              previewDataStore[existIdx] = { ...previewDataStore[existIdx], ...rec };
            } else {
              previewDataStore.push({
                id: 'imp-' + Date.now() + '-' + i,
                ...rec,
                is_submitted: false,
                status_rumdin: null,
                kondisi: null,
                foto_url: null,
                submitted_at: null
              });
            }
          });
        } else {
          // Upsert berdasarkan kolom unik 'npsn' tanpa mereset status survei yang sudah ada
          const { error } = await supabase
            .from('data_survei_sekolah')
            .upsert(parsedRecords, { onConflict: 'npsn', ignoreDuplicates: false });
          if (error) throw error;
        }

        await loadData();
        showToast(`Berhasil mengimpor ${parsedRecords.length} data referensi sekolah!`, 'success');
      } catch (err) {
        showToast('Gagal impor file: ' + (err.message || 'Format file bermasalah'), 'error');
        state.loading = false;
        render();
      }
    }

    // =========================================================================
    // 9. FILTER DATA & EKSPOR LAPORAN (EXCEL & PDF)
    // =========================================================================
    function getFilteredSurveiData() {
      const q = state.searchQuery.toLowerCase().trim();
      return state.allData.filter(item => {
        const matchQuery = !q ||
          (item.nama_sekolah || '').toLowerCase().includes(q) ||
          (item.kecamatan || '').toLowerCase().includes(q) ||
          (item.npsn || '').toLowerCase().includes(q);

        if (!matchQuery) return false;

        switch (state.filterStatus) {
          case 'submitted':
            return item.is_submitted === true;
          case 'unsubmitted':
            return !item.is_submitted;
          case 'ada':
            return item.is_submitted && item.status_rumdin === 'Ada';
          case 'belum':
            return item.is_submitted && item.status_rumdin === 'Belum Ada';
          default:
            return true;
        }
      });
    }

    // =========================================================================
    // 10. KALKULASI STATISTIK & GRAFIK CHART.JS (70% STACKED BAR : 30% DOUGHNUT)
    // =========================================================================
    function computeAnalytics() {
      const total = state.allData.length;
      const submitted = state.allData.filter(d => d.is_submitted).length;
      const unsubmitted = total - submitted;
      const rumdinAda = state.allData.filter(d => d.is_submitted && d.status_rumdin === 'Ada').length;
      const rumdinBelumAda = state.allData.filter(d => d.is_submitted && d.status_rumdin === 'Belum Ada').length;

      const kondisiBaik = state.allData.filter(d => d.kondisi === 'Baik').length;
      const kondisiRingan = state.allData.filter(d => d.kondisi === 'Rusak Ringan').length;
      const kondisiBerat = state.allData.filter(d => d.kondisi === 'Rusak Berat').length;

      // Bangun tepat 16 Kecamatan (gabungkan kecamatan unik dari data + daftar standar 16 kecamatan)
      const dataKecSet = new Set(state.allData.map(d => (d.kecamatan || '').trim()).filter(Boolean));
      const kecList = Array.from(dataKecSet);

      for (const defKec of DEFAULT_16_KECAMATAN) {
        if (kecList.length >= 16) break;
        if (!dataKecSet.has(defKec)) {
          kecList.push(defKec);
          dataKecSet.add(defKec);
        }
      }
      const final16Kecamatan = kecList.slice(0, 16);

      const kecStats = final16Kecamatan.map(kec => {
        const schoolsInKec = state.allData.filter(d => (d.kecamatan || '').trim() === kec);
        const sCount = schoolsInKec.filter(d => d.is_submitted).length;
        const uCount = schoolsInKec.length - sCount;
        return {
          kecamatan: kec,
          sudah: sCount,
          belum: uCount
        };
      });

      return {
        total,
        submitted,
        unsubmitted,
        rumdinAda,
        rumdinBelumAda,
        kondisiBaik,
        kondisiRingan,
        kondisiBerat,
        kecStats
      };
    }

    function renderCharts() {
      if (state.session?.role !== 'admin' || state.activeAdminMenu !== 'dashboard') return;

      const barCanvas = document.getElementById('kecamatanStackedChart');
      const doughnutCanvas = document.getElementById('rumdinDoughnutChart');
      if (!barCanvas || !doughnutCanvas) return;

      const stats = computeAnalytics();

      if (barChartInstance) {
        barChartInstance.destroy();
        barChartInstance = null;
      }
      if (doughnutChartInstance) {
        doughnutChartInstance.destroy();
        doughnutChartInstance = null;
      }

      // 1. Stacked Bar Chart (16 Kecamatan: Biru = Sudah Mengisi, Silver = Belum Mengisi)
      barChartInstance = new Chart(barCanvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: stats.kecStats.map(k => k.kecamatan),
          datasets: [
            {
              label: 'Sudah Mengisi',
              data: stats.kecStats.map(k => k.sudah),
              backgroundColor: '#1E62B5',
              hoverBackgroundColor: '#174E93',
              borderRadius: { topLeft: 0, topRight: 0, bottomLeft: 4, bottomRight: 4 },
              barPercentage: 0.65,
              categoryPercentage: 0.8
            },
            {
              label: 'Belum Mengisi',
              data: stats.kecStats.map(k => k.belum),
              backgroundColor: '#CBD5E1',
              hoverBackgroundColor: '#94A3B8',
              borderRadius: { topLeft: 4, topRight: 4, bottomLeft: 0, bottomRight: 0 },
              barPercentage: 0.65,
              categoryPercentage: 0.8
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'top',
              align: 'end',
              labels: {
                usePointStyle: true,
                pointStyle: 'rectRounded',
                boxWidth: 10,
                font: { family: 'Plus Jakarta Sans', size: 12, weight: '600' },
                color: '#475569'
              }
            },
            tooltip: {
              backgroundColor: '#1E293B',
              padding: 10,
              titleFont: { family: 'Plus Jakarta Sans', size: 12, weight: '700' },
              bodyFont: { family: 'Plus Jakarta Sans', size: 12 },
              callbacks: {
                footer: (items) => {
                  const totalKec = items.reduce((acc, it) => acc + (it.parsed.y || 0), 0);
                  return `Total Sekolah: ${totalKec}`;
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true,
              grid: { display: false },
              ticks: {
                font: { family: 'Plus Jakarta Sans', size: 10, weight: '500' },
                color: '#64748B',
                maxRotation: 45,
                minRotation: 35
              }
            },
            y: {
              stacked: true,
              beginAtZero: true,
              ticks: {
                precision: 0,
                font: { family: 'Plus Jakarta Sans', size: 11 },
                color: '#64748B'
              },
              grid: {
                color: '#F1F5F9'
              }
            }
          }
        }
      });

      // 2. Doughnut Chart (Perbandingan Jawaban "Ada" vs "Belum Ada")
      const totalResponded = stats.rumdinAda + stats.rumdinBelumAda;
      const chartDataValues = totalResponded > 0 ? [stats.rumdinAda, stats.rumdinBelumAda] : [0, 0];

      doughnutChartInstance = new Chart(doughnutCanvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: ['Ada Rumah Dinas', 'Belum Ada'],
          datasets: [{
            data: totalResponded > 0 ? chartDataValues : [1],
            backgroundColor: totalResponded > 0 ? ['#1E62B5', '#D92B2B'] : ['#E2E8F0'],
            hoverBackgroundColor: totalResponded > 0 ? ['#174E93', '#B91C1C'] : ['#CBD5E1'],
            borderWidth: 3,
            borderColor: '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '72%',
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              enabled: totalResponded > 0,
              backgroundColor: '#1E293B',
              padding: 10,
              bodyFont: { family: 'Plus Jakarta Sans', size: 12 }
            }
          }
        }
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    function renderModals() {
      let html = '';

      // 1. Modal Preview Foto
      if (state.photoModalUrl) {
        html += `
          <div class="fixed inset-0 z-[1000000] bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
            <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl">
              <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-slate-800 truncate pr-4">${escapeHtml(state.photoModalTitle)}</h3>
                <button data-action="close-photo-modal" class="p-1.5 rounded-lg bg-slate-100 hover:bg-red-100 text-slate-600 hover:text-[#D92B2B] transition cursor-pointer">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="p-4 bg-slate-100 flex items-center justify-center max-h-[75vh]">
                <img src="${escapeHtml(state.photoModalUrl)}" alt="Preview Foto" class="max-h-[70vh] w-auto rounded-xl object-contain shadow" />
              </div>
            </div>
          </div>
        `;
      }

      // 2. Modal Tambah / Edit Sekolah
      if (state.schoolModal.open) {
        const { mode, data } = state.schoolModal;
        html += `
          <div class="fixed inset-0 z-[1000000] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
            <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl border border-slate-200">
              <div class="bg-[#1E62B5] text-white px-5 py-4 flex items-center justify-between">
                <h3 class="text-sm font-extrabold">${mode === 'add' ? 'Tambah Referensi Sekolah Baru' : 'Edit Data Referensi Sekolah'}</h3>
                <button data-action="close-school-modal" class="p-1 rounded-lg hover:bg-white/15 text-white cursor-pointer">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
              <form id="schoolCrudForm" class="p-5 space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">NPSN <span class="text-[#D92B2B]">*</span></label>
                  <input type="text" name="npsn" required value="${escapeHtml(data.npsn)}" placeholder="Contoh: 40100105"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-[#1E62B5]" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Nama Sekolah <span class="text-[#D92B2B]">*</span></label>
                  <input type="text" name="nama_sekolah" required value="${escapeHtml(data.nama_sekolah)}" placeholder="Contoh: SD Negeri 05 Merdeka"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-[#1E62B5]" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Alamat Sekolah</label>
                  <input type="text" name="alamat" value="${escapeHtml(data.alamat)}" placeholder="Jl. Raya Pendidikan No. 10"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-[#1E62B5]" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Kecamatan <span class="text-[#D92B2B]">*</span></label>
                  <input type="text" name="kecamatan" list="kecamatanSuggestions" required value="${escapeHtml(data.kecamatan)}" placeholder="Pilih atau ketik nama kecamatan"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-[#1E62B5]" />
                  <datalist id="kecamatanSuggestions">
                    ${DEFAULT_16_KECAMATAN.map(k => `<option value="${escapeHtml(k)}"></option>`).join('')}
                  </datalist>
                </div>
                <div class="pt-2 flex items-center justify-end gap-2">
                  <button type="button" data-action="close-school-modal"
                    class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition cursor-pointer">
                    Batal
                  </button>
                  <button type="submit"
                    class="px-4 py-2 rounded-xl bg-[#1E62B5] hover:bg-blue-800 text-white text-xs font-bold shadow transition cursor-pointer">
                    Simpan Data
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // 3. Modal Konfirmasi Kustom (Pengganti confirm())
      if (state.confirmModal.open) {
        html += `
          <div class="fixed inset-0 z-[1000001] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
            <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
              <div class="w-11 h-11 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mb-3.5">
                <i data-lucide="alert-circle" class="w-6 h-6"></i>
              </div>
              <h3 class="text-base font-extrabold text-slate-800">${escapeHtml(state.confirmModal.title)}</h3>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">${escapeHtml(state.confirmModal.message)}</p>
              <div class="mt-5 flex items-center justify-end gap-2.5">
                <button data-action="close-confirm"
                  class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition cursor-pointer">
                  Batal
                </button>
                <button data-action="execute-confirm"
                  class="px-4 py-2 rounded-xl ${state.confirmModal.confirmColor} text-white text-xs font-bold shadow transition cursor-pointer">
                  ${escapeHtml(state.confirmModal.confirmText)}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return html;
    }

    function renderToast() {
      let container = document.getElementById('rumdin-toast-box');
      if (!container) {
        container = document.createElement('div');
        container.id = 'rumdin-toast-box';
        container.className = 'fixed top-4 right-4 z-[1000005] max-w-sm w-full pointer-events-none px-4 sm:px-0';
        document.getElementById('rumdin-app-root').appendChild(container);
      }

      if (!state.toast) {
        container.innerHTML = '';
        return;
      }

      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-[#D92B2B] text-white border-red-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      const icons = {
        success: 'check-circle',
        error: 'alert-octagon',
        info: 'info'
      };

      container.innerHTML = `
        <div class="pointer-events-auto flex items-start gap-2.5 p-3.5 rounded-xl shadow-xl border ${styles[state.toast.type] || styles.info} animate-fade-in">
          <i data-lucide="${icons[state.toast.type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i>
          <div class="text-xs font-semibold leading-relaxed flex-1">${escapeHtml(state.toast.message)}</div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons();
    }

    function updateDigitalClock() {
      const el = document.getElementById('liveDigitalClock');
      if (el) {
        el.textContent = new Date().toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }
    }

    function render() {
      const root = document.getElementById('rumdin-app-root');
      if (!root) return;

      let content = '';
      if (!state.session) {
        content = renderLoginScreen();
      } else if (state.session.role === 'admin') {
        content = renderAdminLayout();
      } else {
        content = renderSchoolView();
      }

      content += renderModals();
      root.innerHTML = content;

      // Render Ikon Lucide
      if (window.lucide) {
        window.lucide.createIcons();
      }

      // Render Toast jika sedang aktif
      renderToast();

      // Update jam digital
      updateDigitalClock();

      // Render grafik Chart.js jika di halaman Dashboard Admin
      renderCharts();

      // Pasang listener input dinamis
      bindDynamicInputs();
    }

    // =========================================================================
    // 12. EVENT DELEGATION & INPUT LISTENERS
    // =========================================================================
    function bindDynamicInputs() {
      const schoolLoginForm = document.getElementById('schoolLoginForm');
      if (schoolLoginForm) {
        schoolLoginForm.onsubmit = (e) => {
          e.preventDefault();
          const npsn = document.getElementById('inputNpsn')?.value;
          handleSchoolLogin(npsn);
        };
      }

      const adminLoginForm = document.getElementById('adminLoginForm');
      if (adminLoginForm) {
        adminLoginForm.onsubmit = (e) => {
          e.preventDefault();
          const email = document.getElementById('inputAdminEmail')?.value;
          const pass = document.getElementById('inputAdminPassword')?.value;
          handleAdminLogin(email, pass);
        };
      }

      const surveiSearchInput = document.getElementById('surveiSearchInput');
      if (surveiSearchInput) {
        surveiSearchInput.oninput = (e) => {
          state.searchQuery = e.target.value;
          render();
          const el = document.getElementById('surveiSearchInput');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        };
      }

      const surveiFilterSelect = document.getElementById('surveiFilterSelect');
      if (surveiFilterSelect) {
        surveiFilterSelect.onchange = (e) => {
          state.filterStatus = e.target.value;
          render();
        };
      }

      const refSearchInput = document.getElementById('refSearchInput');
      if (refSearchInput) {
        refSearchInput.oninput = (e) => {
          state.refSearchQuery = e.target.value;
          render();
          const el = document.getElementById('refSearchInput');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        };
      }

      const bulkUploadInput = document.getElementById('bulkUploadInput');
      if (bulkUploadInput) {
        bulkUploadInput.onchange = (e) => {
          if (e.target.files?.[0]) {
            handleBulkImportFile(e.target.files[0]);
          }
        };
      }

      const schoolPhotoInput = document.getElementById('schoolPhotoInput');
      if (schoolPhotoInput) {
        schoolPhotoInput.onchange = (e) => {
          if (e.target.files?.[0]) {
            handlePhotoFileChange(e.target.files[0]);
          }
        };
      }

      const schoolCrudForm = document.getElementById('schoolCrudForm');
      if (schoolCrudForm) {
        schoolCrudForm.onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(schoolCrudForm);
          saveSchoolManual({
            npsn: fd.get('npsn'),
            nama_sekolah: fd.get('nama_sekolah'),
            alamat: fd.get('alamat'),
            kecamatan: fd.get('kecamatan')
          });
        };
      }
    }

    document.getElementById('rumdin-app-root').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'switch-login-tab':
          state.loginTab = btn.getAttribute('data-tab');
          render();
          break;

        case 'quick-login-admin':
          if (IS_PREVIEW) handleAdminLogin('admin@preview.local', 'preview');
          break;

        case 'quick-login-school':
          if (IS_PREVIEW) handleSchoolLogin('40100102');
          break;

        case 'logout':
          handleLogout();
          break;

        case 'toggle-sidebar':
          state.sidebarCollapsed = !state.sidebarCollapsed;
          render();
          break;

        case 'nav-admin':
          state.activeAdminMenu = btn.getAttribute('data-menu');
          render();
          break;

        case 'export-excel':
          exportToExcel();
          break;

        case 'export-pdf':
          exportToPDF();
          break;

        case 'view-photo':
          state.photoModalUrl = btn.getAttribute('data-url');
          state.photoModalTitle = btn.getAttribute('data-title');
          render();
          break;

        case 'close-photo-modal':
          state.photoModalUrl = null;
          state.photoModalTitle = '';
          render();
          break;

        case 'reset-survei': {
          const id = btn.getAttribute('data-id');
          const target = state.allData.find(s => String(s.id) === String(id));
          if (target) confirmResetSurvey(target);
          break;
        }

        case 'download-template':
          downloadTemplateExcel();
          break;

        case 'open-add-school':
          state.schoolModal = {
            open: true,
            mode: 'add',
            data: { id: null, npsn: '', nama_sekolah: '', alamat: '', kecamatan: '' }
          };
          render();
          break;

        case 'open-edit-school': {
          const id = btn.getAttribute('data-id');
          const target = state.allData.find(s => String(s.id) === String(id));
          if (target) {
            state.schoolModal = {
              open: true,
              mode: 'edit',
              data: { ...target }
            };
            render();
          }
          break;
        }

        case 'close-school-modal':
          state.schoolModal.open = false;
          render();
          break;

        case 'delete-school': {
          const id = btn.getAttribute('data-id');
          const target = state.allData.find(s => String(s.id) === String(id));
          if (target) confirmDeleteSchool(target);
          break;
        }

        case 'select-rumdin':
          state.schoolForm.status_rumdin = btn.getAttribute('data-value');
          if (state.schoolForm.status_rumdin === 'Belum Ada') {
            state.schoolForm.kondisi = '';
            state.schoolForm.file = null;
            state.schoolForm.previewDataUrl = '';
          }
          render();
          break;

        case 'select-kondisi':
          state.schoolForm.kondisi = btn.getAttribute('data-value');
          render();
          break;

        case 'submit-school-survey':
          submitSchoolSurvey();
          break;

        case 'close-confirm':
          closeConfirm();
          break;

        case 'execute-confirm':
          if (typeof state.confirmModal.onConfirm === 'function') {
            state.confirmModal.onConfirm();
          }
          break;
      }
    });

    // Jalankan Jam Digital & Inisialisasi Sesi saat Halaman Dimuat
    window.addEventListener('DOMContentLoaded', () => {
      clockInterval = setInterval(updateDigitalClock, 1000);
      initSession();
    });
  </script>
</body>
</html>
